[package]
name = "rustree"
version = "0.1.0"
edition = "2021"

# 依赖声明理由：
#   tree 命令的 C 源码使用了大量 std 无法提供的系统能力，必须使用 libc FFI：
#     1. getpwuid()/getgrgid()   —— 将 uid/gid 解析为用户名/组名（hash.c）
#     2. getxattr()/listxattr()  —— SELinux 上下文与 ACL 检测（tree.c，仅 Linux）
#     3. setlocale()/nl_langinfo() —— locale 与字符集检测（tree.c）
#     4. gethostname()           —— OSC 8 超链接的 authority（tree.c）
#     5. strftime()/localtime_r() —— do_date() 的日期格式化（tree.c）
#   libc 是事实上的标准 FFI 绑定 crate，非第三方功能库。
[dependencies]
fluent-bundle = "0.15"
fluent-langneg = "0.13"
libc = "0.2"
unic-langid = "0.9"

[[bin]]
name = "rt"
path = "src/main.rs"

[profile.release]
opt-level = 2

[package.metadata.deb]
maintainer = "TC999 <88823709+TC999@users.noreply.github.com>"
maintainer-scripts = "debian"
section = "utils"
priority = "optional"
depends = ""
assets = [
  # 把二进制和 locales 放到 /usr/bin/rt
  ["target/release/rt", "/usr/bin/rt", "0755"],
  ["target/release/locales/*", "/usr/share/rustree/locales/", "0644"],
  # 可选：把 README 放到文档目录
  ["README.md", "/usr/share/doc/rustree/README.md", "0644"],
  ["LICENSE", "/usr/share/doc/rustree/LICENSE", "0644"],
]