name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: "发行版本"
      name:
        type: string
        required: true
        description: "发行版名称"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ✅ 合并为一个 job，通过矩阵区分系统
  build:
    name: build-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows
            binary: rt.exe
          - os: ubuntu-latest
            name: linux
            binary: rt
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      # ✅ 仅 Linux 执行，利用 runner.os 判断
      - name: Copy shell script(Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x *.sh
          cp *.sh target/release

      - name: Build Debian Package
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb
          cargo deb --no-build

      - name: Upload Debian Package
        uses: actions/upload-artifact@v7.0.1
        if: runner.os == 'Linux'
        with:
          name: debian
          path: |
            target/debian/*.deb

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.name }}
          path: |
            target/release/locales
            target/release/${{ matrix.binary }}
            target/release/*.sh   # Windows 下无匹配文件会自动忽略

  release:
    name: 发行
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载文件
        uses: actions/download-artifact@v4
        with:
          path: .

      # ✅ 合并为循环，避免重复步骤
      - name: 重新压缩
        run: |
          for dir in linux windows; do
            [ -d "$dir" ] && (cd "$dir" && zip -r "../rustree-$dir.zip" .)
          done

      - name: 移动文件(Debian 包)
        run: mv debian/*.deb .

      - name: 自动发布发行版
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.name }}
          tag_name: ${{ inputs.tag }}
          draft: false
          make_latest: true
          files: |
            rustree-*.zip
            *.deb